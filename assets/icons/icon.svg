<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="#2563eb" stroke-width="4" stroke-opacity="0.3" />

  <!-- Remote body outline -->
  <rect x="166" y="70" width="180" height="372" rx="40" fill="url(#screenGrad)" stroke="#334155" stroke-width="5" />
  
  <!-- Indicator LED -->
  <circle cx="256" cy="100" r="6" fill="#38bdf8" filter="url(#glow)" />

  <!-- Power button -->
  <circle cx="210" cy="135" r="16" fill="#ef4444" />
  <path d="M210 127 v7 M204 130 a7 7 0 1 0 12 0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Mute button -->
  <circle cx="302" cy="135" r="16" fill="#334155" />
  <path d="M297 132 h2 l4-3 v12 l-4-3 h-2 z" fill="#94a3b8" />

  <!-- D-pad circle -->
  <circle cx="256" cy="225" r="54" fill="#1e293b" stroke="#475569" stroke-width="3" />
  <!-- D-pad center OK -->
  <circle cx="256" cy="225" r="22" fill="url(#accentGrad)" />
  <text x="256" y="230" fill="#ffffff" font-size="11" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">OK</text>
  
  <!-- D-pad arrows -->
  <path d="M256 182 l-6 8 h12 z" fill="#94a3b8" />
  <path d="M256 268 l-6-8 h12 z" fill="#94a3b8" />
  <path d="M213 225 l8-6 v12 z" fill="#94a3b8" />
  <path d="M299 225 l-8-6 v12 z" fill="#94a3b8" />

  <!-- Home & Back buttons -->
  <rect x="195" y="300" width="46" height="28" rx="8" fill="#334155" />
  <path d="M218 308 l-7 6 v7 h4 v-4 h6 v4 h4 v-7 z" fill="#cbd5e1" />

  <rect x="271" y="300" width="46" height="28" rx="8" fill="#334155" />
  <path d="M291 314 l4-5 h-8 m4 5 l-4 5" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Volume rocker -->
  <rect x="195" y="345" width="46" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="218" y="364" fill="#94a3b8" font-size="14" font-weight="bold" text-anchor="middle">+</text>
  <text x="218" y="388" fill="#94a3b8" font-size="14" font-weight="bold" text-anchor="middle">−</text>

  <!-- Wi-Fi waves above -->
  <path d="M226 50 a40 40 0 0 1 60 0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <path d="M236 60 a25 25 0 0 1 40 0" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
</svg>
