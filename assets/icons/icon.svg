<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="50%" stop-color="#080A0F" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#1E293B" stroke-width="3" stroke-opacity="0.6" />

  <!-- Subtle Precision Target Grid Crosshairs -->
  <line x1="256" y1="120" x2="256" y2="392" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.5" />
  <line x1="120" y1="256" x2="392" y2="256" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.5" />

  <!-- Outer Pulse Waves (Precision Radar & ECP Signal) -->
  <path d="M 124 164 A 160 160 0 0 0 124 348" fill="none" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 388 164 A 160 160 0 0 1 388 348" fill="none" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Mid Control Ring / Waves -->
  <path d="M 170 196 A 105 105 0 0 0 170 316" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" />
  <path d="M 342 196 A 105 105 0 0 1 342 316" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" />

  <!-- Inner Active Focus Bracket -->
  <path d="M 210 224 A 55 55 0 0 0 210 288" fill="none" stroke="#60A5FA" stroke-width="11" stroke-linecap="round" />
  <path d="M 302 224 A 55 55 0 0 1 302 288" fill="none" stroke="#60A5FA" stroke-width="11" stroke-linecap="round" />

  <!-- Central Precision Core (Omni-Signal Trigger) -->
  <circle cx="256" cy="256" r="28" fill="url(#coreGrad)" filter="url(#coreGlow)" />
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" opacity="0.95" />

  <!-- Corner Alignment Nodes (Minimal Hardware Details) -->
  <circle cx="84" cy="84" r="5" fill="#334155" />
  <circle cx="428" cy="84" r="5" fill="#334155" />
  <circle cx="84" cy="428" r="5" fill="#334155" />
  <circle cx="428" cy="428" r="5" fill="#334155" />
</svg>
