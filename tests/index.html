<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RemoteOne - Test Suite</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #0a0d14; color: #f1f5f9; font-family: system-ui, sans-serif; padding: 24px; }
    .card { background: #121826; border: 1px solid #232d42; border-radius: 14px; }
    .test-pass { color: #10b981; }
    .test-fail { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 720px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h4 class="fw-bold mb-0">🧪 RemoteOne Test Suite</h4>
        <div class="text-muted small">Validación de Requisitos, Persistencia, ErrorHandler y Drivers</div>
      </div>
      <button class="btn btn-primary btn-sm fw-bold" id="btn-run-tests">Ejecutar Pruebas</button>
    </div>

    <div id="test-summary" class="alert alert-dark border border-secondary mb-3 d-none"></div>

    <div class="card p-3">
      <div id="test-results-list">
        <div class="text-muted text-center py-4">Haz clic en "Ejecutar Pruebas" para iniciar.</div>
      </div>
    </div>

    <div class="mt-3 text-center">
      <a href="../index.html" class="btn btn-outline-secondary btn-sm text-white">← Volver a RemoteOne App</a>
    </div>
  </div>

  <script type="module">
    import { runAllTests } from './test_runner.js';

    document.getElementById('btn-run-tests').addEventListener('click', async () => {
      const list = document.getElementById('test-results-list');
      const summary = document.getElementById('test-summary');
      list.innerHTML = '';
      summary.classList.add('d-none');

      const res = await runAllTests((t) => {
        const div = document.createElement('div');
        div.className = 'py-2 border-bottom border-dark d-flex align-items-center justify-content-between small';
        div.innerHTML = `
          <span>${t.name}</span>
          <span class="${t.status === 'pass' ? 'test-pass fw-bold' : 'test-fail fw-bold'}">
            ${t.status === 'pass' ? '✓ PASS' : '✗ FAIL'}
          </span>
        `;
        list.appendChild(div);
      });

      summary.classList.remove('d-none');
      summary.className = `alert ${res.failed === 0 ? 'alert-success' : 'alert-danger'} mb-3`;
      summary.innerHTML = `
        <strong>Resultado Final:</strong> ${res.passed}/${res.total} pruebas superadas (${res.failed} fallos).
      `;
    });
  </script>
</body>
</html>
